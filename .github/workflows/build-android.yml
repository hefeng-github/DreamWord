name: Build Android APK

# 触发条件：
#   - push 到 main 且改动 android/ 或 workflow 本身
#   - 在 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [ main, 'feat/**' ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Gradle wrapper jar exists
        working-directory: android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Restore signing keystore
        # 若配置了 GitHub Secret SIGNING_KEYSTORE_BASE64，则从 Secret 还原 keystore 并设置
        # 签名环境变量；否则跳过（build.gradle 会自动 fallback 到 debug 签名，
        # release APK 仍可安装，但每次 CI 构建签名可能不同）。
        # ★ 配置正式签名的步骤见 android/README.md「签名配置」 ★
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        working-directory: android/app
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from secret..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
            ls -lh release.keystore
          else
            echo "No signing secret found. Release APK will use debug signing."
          fi

      - name: Download PP-OCRv6 models into assets/models
        # 模型不入仓库，编译时从 MaaCommonAssets 下载（PP-OCRv6 small，det+rec 两段式）。
        # 来源：https://github.com/MaaXYZ/MaaCommonAssets/tree/main/OCR/ppocr_v6/small
        # 推理用 onnxruntime-android，预处理/后处理在 OnnxOcrEngineImpl 自实现。
        run: |
          set -e
          mkdir -p android/app/src/main/assets/models
          BASE="https://raw.githubusercontent.com/MaaXYZ/MaaCommonAssets/main/OCR/ppocr_v6/small"
          curl -fSL -o android/app/src/main/assets/models/det.onnx  "$BASE/det.onnx"
          curl -fSL -o android/app/src/main/assets/models/rec.onnx  "$BASE/rec.onnx"
          curl -fSL -o android/app/src/main/assets/models/keys.txt  "$BASE/keys.txt"
          ls -lh android/app/src/main/assets/models/

      # 用 tee 把完整输出存到文件，便于失败时上传分析
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Build release APK (signed)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DreamWord-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DreamWord-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      # 失败时上传完整构建日志，便于定位编译错误
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/build-debug.log
            android/build-release.log
          if-no-files-found: warn
          retention-days: 7
